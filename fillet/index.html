<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adam's Sphere + Fillet Calculator</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#f3f5f8;color:#222;max-width:560px;margin:auto}h1{font-size:1.3em}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}label{min-width:0;font-size:.9em;display:flex;flex-direction:column}
input,select{width:100%}input,select,button{max-width:100%;min-width:0;font-size:1.1em;padding:10px;border:1px solid #aab;border-radius:8px}
button{background:#1565c0;color:#fff;border:0;margin-top:10px;width:48%}#clr{background:#777}#err{color:#c62828;font-weight:bold;min-height:1.2em}
svg{width:100%;max-width:100%;display:block;box-sizing:border-box;background:#fff;border-radius:8px;margin-top:10px}#res{background:#fff;padding:10px;border-radius:8px;margin-top:8px;font-family:monospace}.w{color:#c62828;font-family:system-ui;font-size:.85em}pre{font-size:1.15em;background:#eef;padding:6px;border-radius:6px}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1565c0"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<header style="display:flex;align-items:center;gap:8px;margin:6px 0 10px"><svg width="24" height="12" viewBox="0 0 60 30" style="flex:none;width:24px;height:12px;margin:0;border-radius:0;background:none;border:1px solid #ccc" aria-label="Union Jack"><clipPath id="uks"><path d="M0,0v30h60v-30z"/></clipPath><clipPath id="ukt"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><g clip-path="url(#uks)"><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg><div><h1 style="margin:0;font-size:1.2em">Adam's Sphere + Fillet Calculator</h1><div style="font-size:.8em;color:#555">Leicester, England</div></div></header>
<div class="g"><label>Units <select id="u"><option>mm</option><option value="in">inch</option></select></label>
<label>Enter sphere as <select id="srt"><option value="r">Radius R</option><option value="d">Diameter SØ</option></select></label>
<label id="srl"><span>Sphere radius R</span><input id="R" type="number" inputmode="decimal" step="any"></label>
<label>Part diameter D<input id="D" type="number" inputmode="decimal" step="any"></label>
<label>Fillet radius r<input id="r" type="number" inputmode="decimal" step="any"></label>
<label>Part length L (optional)<input id="L" type="number" inputmode="decimal" step="any"></label>
<label>Arc direction <select id="ad"><option value="auto" selected>Computed (default)</option><option value="opp">Opposite direction</option></select></label></div>
<p style="font-size:.85em">Domed end: Z0 = dome apex (front of part) on X0. Sphere centre on the centreline at Z−R. Fillet r blends the dome into the OD. X = diameter.</p>
<button id="go">Calculate</button> <button id="clr">Clear</button>
<div id="err"></div><div id="res"></div>
<svg id="svg" viewBox="0 0 320 230"></svg>
<script>
const X=v=>{const s=(+v.toFixed(3)).toString();return s.includes(".")?s:s+"."},Z3=v=>(Math.abs(v)<5e-4?0:v).toFixed(3);
function dir(c,p,q){const cr=(p[0]-c[0])*(q[1]-c[1])-(p[1]-c[1])*(q[0]-c[0]);return cr>0?"G03":"G02";}
function solve(i){let {R,D,r,L,opp}=i;
if(!(R>0))throw"R must be positive";if(!(D>0))throw"Diameter D must be positive";if(!(r>0))throw"Fillet r must be positive";
if(!(R>r))throw"R must be bigger than fillet r";const h=D/2;if(!(h>r))throw"D/2 ("+h+") must be bigger than fillet r";
if(!(R-r>h-r))throw"Impossible: R must be bigger than D/2 ("+h+") so the dome reaches the OD";
const yc=h-r,xc=Math.sqrt((R-r)**2-yc*yc),m=yc/xc,a=Math.sqrt(R*R/(1+m*m)),b=m*a;
// lathe points [Z, radius]
const C0=[-R,0],A=[0,0],S=[-(R-a),b],F=[-(R-xc),h],C1=[-(R-xc),yc];
if(L!=null&&!isNaN(L)){L=Math.abs(L);if(!(L>R-xc+1e-9))throw"Part length L must be more than "+(R-xc).toFixed(3)+" (past the fillet)";}else L=null;
const cs=dir(C0,A,S),cf=dir(C1,S,F),fl=g=>opp?(g==="G03"?"G02":"G03"):g,ds=fl(cs),df=fl(cf);
const prog=`G01 X0. Z0.\n${ds} X${X(2*S[1])} Z${Z3(S[0])} R${X(R)}\n${df} X${X(D)} Z${Z3(F[0])} R${X(r)}`+(L!=null?`\nG01 X${X(D)} Z${Z3(-L)}`:"");
return{R,D,r,L,h,xc,yc,m,a,b,C0,A,S,F,C1,cs,cf,ds,df,prog,dome:R-Math.sqrt(R*R-h*h)};}
if(typeof module!=="undefined")module.exports={solve};
else{const $=id=>document.getElementById(id),F=v=>v.toFixed(3);
function draw(q){if(!q){$("svg").innerHTML="";return}
const zmin=-Math.max(q.R,q.L||0)*1.05,x0=290,x1=30,cy=200,sc=Math.min((x0-x1)/(-zmin),170/q.h),px=z=>x0+z*sc,py=x=>cy-x*sc,
T=(x,y,t,c,a)=>`<text x="${x}" y="${y}" font-size="10" fill="${c||'#000'}" text-anchor="${a||'middle'}">${t}</text>`;
const arc=(c,rr,p,qq,n)=>{const a0=Math.atan2(p[1]-c[1],p[0]-c[0]),a1=Math.atan2(qq[1]-c[1],qq[0]-c[0]);const o=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;o.push([c[0]+rr*Math.cos(t),c[1]+rr*Math.sin(t)])}return o};
const zl=q.L!=null?-q.L:zmin,pts=[q.A,...arc(q.C0,q.R,q.A,q.S,40),...arc(q.C1,q.r,q.S,q.F,10),[zl,q.h]];
s=`<path d="M${pts.map(p=>px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join(" L")} L${px(zl)} ${cy}Z" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>`;
s+=`<line x1="5" y1="${cy}" x2="315" y2="${cy}" stroke="#888" stroke-dasharray="8 3"/>`+T(8,cy+12,"X0 centreline","#888","start");
s+=`<line x1="${px(q.C0[0])}" y1="${cy}" x2="${px(q.S[0])}" y2="${py(q.S[1])}" stroke="#c62828" stroke-dasharray="3"/><circle cx="${px(q.C0[0])}" cy="${cy}" r="3.5" fill="#c62828"/>`+T(px(q.C0[0]),cy-6,"centre Z"+F(q.C0[0])+"  R"+X(q.R),"#c62828","start");
s+=`<circle cx="${px(q.C1[0])}" cy="${py(q.C1[1])}" r="${q.r*sc}" fill="none" stroke="#6a1b9a" stroke-dasharray="2"/><circle cx="${px(q.C1[0])}" cy="${py(q.C1[1])}" r="2" fill="#6a1b9a"/>`;
[[q.S,"S X"+X(2*q.S[1])+" Z"+F(q.S[0]),12],[q.F,"F X"+X(q.D)+" Z"+F(q.F[0]),-6]].forEach(([p,t,dy])=>s+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="3" fill="#2e7d32"/>`+T(px(p[0])-4,py(p[1])+dy+(dy>0?14:0),t,"#2e7d32","end"));
s+=`<line x1="${px(0)}" y1="8" x2="${px(0)}" y2="${cy+18}" stroke="#c62828" stroke-dasharray="4"/>`+T(px(0)-3,cy+26,"Z0 apex","#c62828","end")+T(px(-q.L||zmin)+40,py(q.h)-6,"OD Ø"+X(q.D),"#1565c0")+T(150,224,"← chuck"+(q.L!=null?"   L="+X(q.L):""),"#555");
$("svg").innerHTML=s;}
let s;
function calc(){$("err").textContent="";const p=k=>parseFloat($(k).value),u=$("u").value;let R=p("R");if($("srt").value==="d")R/=2;
try{const q=solve({R,D:p("D"),r:p("r"),L:$("L").value===""?null:p("L"),opp:$("ad").value==="opp"}),P=(n,pt,d)=>`${n}: X${F(d==null?2*pt[1]:d)} Z${F(pt[0])}<br>`;
$("res").innerHTML=`<pre>${q.prog}</pre><b>Lathe points (X = diameter, Z0 = apex)</b><br>`+P("Apex",q.A)+P("S sphere tangent",q.S)+P("Fillet centre",q.C1)+P("F OD tangent",q.F,q.D)+P("Sphere centre",q.C0,0)+
`Dome height (to full Ø${X(q.D)}) = ${F(q.dome)} ${u}<br><br><b>Working (sphere centre = origin; x/a = along axis toward apex, y/b = radius)</b><br>`+
`1) y<sub>c</sub> = D/2 − r = ${F(q.h)} − ${F(q.r)} = ${F(q.yc)}<br>&nbsp;&nbsp; x<sub>c</sub> = √((R−r)² − y<sub>c</sub>²) = √(${F(q.R-q.r)}² − ${F(q.yc)}²) = ${F(q.xc)}<br>&nbsp;&nbsp; OD point (x, y) = (${F(q.xc)}, ${F(q.h)}) → Z = −(R − x) = ${F(q.F[0])}<br>`+
`2) m = y<sub>c</sub>/x<sub>c</sub> = ${F(q.m)}<br>3) a = √(R²/(1+m²)) = ${F(q.a)}, b = m·a = ${F(q.b)}<br>&nbsp;&nbsp; sphere point (a, b) = (${F(q.a)}, ${F(q.b)}) → X = 2b = ${F(2*q.b)}, Z = −(R − a) = ${F(q.S[0])}<br>`+
`<span class="w">⚠ VERIFY IN SIMULATION: computed directions (signed cross product, rear-type turret, X up, Z right, tool moving from apex out toward the chuck): sphere ${q.cs}, fillet ${q.cf}. Front turret / reversed path flips G02↔G03 – use the Arc direction selector. No tool nose comp shown. Units: ${u}.</span>`;draw(q)}
catch(e){$("err").textContent=e;$("res").innerHTML="";draw(null)}}
$("go").onclick=calc;["u","ad"].forEach(k=>$(k).onchange=()=>{if($("res").innerHTML)calc()});
$("srt").onchange=()=>{$("srl").firstChild.textContent=$("srt").value==="d"?"Sphere diameter SØ":"Sphere radius R"};
$("clr").onclick=()=>{["R","D","r","L"].forEach(k=>$(k).value="");$("err").textContent="";$("res").innerHTML="";draw(null)};
$("R").value=30;$("D").value=40;$("r").value=2;calc();}
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
