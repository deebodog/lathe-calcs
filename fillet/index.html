<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adam's Sphere + Fillet Calculator</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#f3f5f8;color:#222;max-width:560px;margin:auto}h1{font-size:1.3em}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}label{min-width:0;font-size:.9em;display:flex;flex-direction:column}
input,select{width:100%}input,select,button{max-width:100%;min-width:0;font-size:1.1em;padding:10px;border:1px solid #aab;border-radius:8px}
button{background:#1565c0;color:#fff;border:0;margin-top:10px;width:48%}#clr{background:#777}#err{color:#c62828;font-weight:bold;min-height:1.2em}
svg{width:100%;max-width:100%;display:block;box-sizing:border-box;background:#fff;border-radius:8px;margin-top:10px}#res{background:#fff;padding:10px;border-radius:8px;margin-top:8px;font-family:monospace}.w{color:#c62828;font-family:system-ui;font-size:.85em}pre{font-size:1.15em;background:#eef;padding:6px;border-radius:6px}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1565c0"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<header style="display:flex;align-items:center;gap:8px;margin:6px 0 10px"><svg width="24" height="12" viewBox="0 0 60 30" style="flex:none;width:24px;height:12px;margin:0;border-radius:0;background:none;border:1px solid #ccc" aria-label="Union Jack"><clipPath id="uks"><path d="M0,0v30h60v-30z"/></clipPath><clipPath id="ukt"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><g clip-path="url(#uks)"><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg><div><h1 style="margin:0;font-size:1.2em">Adam's Sphere + Fillet Calculator</h1><div style="font-size:.8em;color:#555">Leicester, England</div></div></header>
<div class="g"><label>Type <select id="shape"><option value="bore" selected>Bore (internal sphere)</option><option value="convex">Convex OD</option></select></label>
<label>Units <select id="u"><option>mm</option><option value="in">inch</option></select></label>
<label>Enter sphere as <select id="srt"><option value="r">Radius R</option><option value="d">Diameter SØ</option></select></label>
<label id="srl"><span>Spherical radius R</span><input id="R" type="number" inputmode="decimal" step="any"></label>
<label>Part width W<input id="W" type="number" inputmode="decimal" step="any"></label>
<label>Fillet radius r<input id="r" type="number" inputmode="decimal" step="any"></label>
<label>Centre Z (blank = −W/2, ± ok)<input id="zc" type="number" inputmode="decimal" step="any"></label></div>
<p style="font-size:.85em">Z0 = front face. X = diameter. Sphere centre on the centreline at mid-width; fillet r blends the sphere into each flat face.</p>
<button id="go">Calculate</button> <button id="clr">Clear</button>
<div id="err"></div><div id="res"></div>
<svg id="svg" viewBox="0 0 320 250"></svg>
<script>
const X=v=>{const s=(+v.toFixed(3)).toString();return s.includes(".")?s:s+"."},Z3=v=>(Math.abs(v)<5e-4?0:v).toFixed(3);
function dir(c,p,q){const cr=(p[0]-c[0])*(q[1]-c[1])-(p[1]-c[1])*(q[0]-c[0]);return cr>0?"G03":"G02";}
function solve(i){let {R,W,r,zc,shape}=i;shape=shape||"bore";
if(!(R>0))throw"R must be positive";if(!(W>0))throw"Width W must be positive";if(!(r>0))throw"Fillet r must be positive";
if(!(R>r))throw"R must be bigger than fillet r";const h=W/2;if(!(h>r))throw"W/2 ("+h+") must be bigger than fillet r";
if(!(R-r>Math.abs(h-r)))throw"Impossible: R − r must exceed W/2 − r (sphere doesn't reach the faces)";
if(zc==null||isNaN(zc))zc=-h;else zc=-Math.abs(zc);
const yc=h-r,xc=Math.sqrt((R-r)**2-yc*yc),m=yc/xc,a=Math.sqrt(R*R/(1+m*m)),b=m*a,k=R/(R-r);
if(!(R>xc))throw"Sphere must exceed the face radial x";
const zf1=zc+h,zf2=zc-h,warn=zf1>1e-9?"Front face is at Z"+Z3(zf1)+" (in front of Z0) – check centre Z.":"";
// points in (Z, Xradius)
const F1=[zf1,xc],S1=[zc+b,a],S2=[zc-b,a],F2=[zf2,xc],C1=[zc+yc,xc],C2=[zc-yc,xc],C0=[zc,0];
const d1=dir(C1,F1,S1),d0=dir(C0,S1,S2),d2=dir(C2,S2,F2),D=p=>X(2*p[1]);
const prog=`G01 X${D(F1)} Z${Z3(F1[0])}\n${d1} X${D(S1)} Z${Z3(S1[0])} R${X(r)}\n${d0} X${D(S2)} Z${Z3(S2[0])} R${X(R)}\n${d2} X${D(F2)} Z${Z3(F2[0])} R${X(r)}`;
return{R,W,r,zc,shape,h,xc,yc,m,a,b,k,F1,S1,S2,F2,C1,C2,C0,d1,d0,d2,prog,warn,peak:2*R};}
if(typeof module!=="undefined")module.exports={solve};
else{const $=id=>document.getElementById(id),F=v=>v.toFixed(3);
function draw(q){if(!q){$("svg").innerHTML="";return}
const x0=280,x1=40,cy=215,sc=Math.min((x0-x1)/q.W,180/q.R),px=z=>x0+(z-q.F1[0])*sc,py=x=>cy-x*sc,
T=(x,y,t,c,a)=>`<text x="${x}" y="${y}" font-size="10" fill="${c||'#000'}" text-anchor="${a||'middle'}">${t}</text>`;
const arc=(c,rr,p,qq,n)=>{const a0=Math.atan2(p[1]-c[1],p[0]-c[0]),a1=Math.atan2(qq[1]-c[1],qq[0]-c[0]);let d=a1-a0;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;const o=[];for(let i=0;i<=n;i++){const t=a0+d*i/n;o.push([c[0]+rr*Math.cos(t),c[1]+rr*Math.sin(t)])}return o};
const pts=[q.F1,...arc(q.C1,q.r,q.F1,q.S1,12),...arc(q.C0,q.R,q.S1,q.S2,60),...arc(q.C2,q.r,q.S2,q.F2,12),q.F2];
const P=pts.map(p=>px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join(" L");
let s=`<line x1="5" y1="${cy}" x2="315" y2="${cy}" stroke="#888" stroke-dasharray="8 3"/>`+T(8,cy-4,"centreline","#888","start");
if(q.shape==="bore"){const top=py(q.R)-14;s+=`<path d="M${P} L${px(q.F2[0])} ${top} L${px(q.F1[0])} ${top}Z" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>`+T(px(q.zc),top+11,"wall","#1565c0");}
else s+=`<path d="M${px(q.F1[0])} ${cy} L${P} L${px(q.F2[0])} ${cy}Z" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>`;
s+=`<line x1="${px(q.zc)}" y1="${cy}" x2="${px(q.zc)}" y2="${py(q.R)}" stroke="#c62828"/><circle cx="${px(q.zc)}" cy="${cy}" r="3.5" fill="#c62828"/>`+T(px(q.zc)+4,(cy+py(q.R))/2,"R"+X(q.R),"#c62828","start");
[q.C1,q.C2].forEach(c=>s+=`<circle cx="${px(c[0])}" cy="${py(c[1])}" r="2.5" fill="#6a1b9a"/><circle cx="${px(c[0])}" cy="${py(c[1])}" r="${q.r*sc}" fill="none" stroke="#6a1b9a" stroke-dasharray="2"/>`);
[[q.F1,"F1","end"],[q.S1,"S1","end"],[q.S2,"S2","start"],[q.F2,"F2","start"]].forEach(([p,n,an])=>s+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="3" fill="#2e7d32"/>`+T(px(p[0])+(an==="end"?-4:4),py(p[1])+(n[0]==="F"?12:-4),n,"#2e7d32",an));
s+=`<line x1="${px(0)}" y1="8" x2="${px(0)}" y2="${cy+8}" stroke="#c62828" stroke-dasharray="4"/>`+T(px(0)+3,12,"Z0","#c62828","start")+T(160,cy+22,"← chuck   "+(q.shape==="bore"?"BORE":"CONVEX OD")+"   W="+X(q.W),"#555");
$("svg").innerHTML=s;}
function calc(){$("err").textContent="";const p=k=>parseFloat($(k).value),u=$("u").value;let R=p("R");if($("srt").value==="d")R/=2;
try{const q=solve({R,W:p("W"),r:p("r"),zc:$("zc").value===""?null:p("zc"),shape:$("shape").value}),L=(n,pt)=>`${n}: X${F(2*pt[1])} Z${F(pt[0])}<br>`;
$("res").innerHTML=`<pre>${q.prog}</pre>`+(q.warn?`<div id="err">⚠ ${q.warn}</div>`:"")+
`<b>Lathe points (X = diameter)</b><br>`+L("F1 front face tangent",q.F1)+L("S1 sphere tangent",q.S1)+`Peak: X${F(q.peak)} Z${F(q.zc)}<br>`+L("S2 sphere tangent",q.S2)+L("F2 rear face tangent",q.F2)+
`Fillet centres: X${F(2*q.C1[1])} Z${F(q.C1[0])} / X${F(2*q.C2[1])} Z${F(q.C2[0])}<br><br><b>Working (sphere centre = origin)</b><br>`+
`1) y<sub>c</sub> = W/2 − r = ${F(q.h)} − ${F(q.r)} = ${F(q.yc)}<br>&nbsp;&nbsp; x<sub>c</sub> = √((R−r)² − y<sub>c</sub>²) = √(${F(q.R-q.r)}² − ${F(q.yc)}²) = ${F(q.xc)}<br>&nbsp;&nbsp; face point (x, y) = (${F(q.xc)}, ${F(q.h)})<br>`+
`2) m = y<sub>c</sub>/x<sub>c</sub> = ${F(q.m)}<br>3) a = √(R²/(1+m²)) = ${F(q.a)}, b = m·a = ${F(q.b)}<br>&nbsp;&nbsp; sphere point (a, b) = (${F(q.a)}, ${F(q.b)})<br>`+
`<span class="w">⚠ VERIFY IN SIMULATION: arc directions from the path geometry (signed cross product, Z right / X up, CCW = G03) – Fanuc rear-type turret, cutting toward the chuck, Z0 front face. Front turret / opposite side flips G02↔G03. No tool nose comp shown. Units: ${u}.</span>`;draw(q)}
catch(e){$("err").textContent=e;$("res").innerHTML="";draw(null)}}
$("go").onclick=calc;["shape","u"].forEach(k=>$(k).onchange=()=>{if($("res").innerHTML)calc()});
$("srt").onchange=()=>{$("srl").firstChild.textContent=$("srt").value==="d"?"Spherical diameter SØ":"Spherical radius R"};
$("clr").onclick=()=>{["R","W","r","zc"].forEach(k=>$(k).value="");$("err").textContent="";$("res").innerHTML="";draw(null)};
$("R").value=30;$("W").value=40;$("r").value=2;calc();}
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
